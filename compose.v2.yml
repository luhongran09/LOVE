services:
  album:
    build:
      context: .
      dockerfile: Dockerfile.v2
    ports:
      - "8080:8080"
    volumes:
      - album-data:/app/server/data
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /app/server/data
      COOKIE_SECURE: "false"
      BACKUP_MAX_MB: ${BACKUP_MAX_MB:-250}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    restart: unless-stopped
volumes:
  album-data:
